function uuid() {
  if (window.crypto && crypto.randomUUID) {
    try { return crypto.randomUUID(); } catch (e) { /* file:// 等环境下回退 */ }
  }
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

function todayStr() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function localDateStr(iso) { // ISO 时间 → 本地日期 YYYY-MM-DD（避免 UTC 偏移问题）
  const d = new Date(iso), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function daysBetween(from, to) { // from/to: 'YYYY-MM-DD'
  const a = new Date(from + 'T00:00:00'), b = new Date(to + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}

      calSelected: null,    // 选中日 'YYYY-MM-DD'

      dragId: null,

    };
  },

  computed: {
    isCloud() {
      return !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase);
    },
    canNotify() { return typeof Notification !== 'undefined'; },
    naiveTheme() { return this.uiDark ? this.naiveDark : null; },
    naiveOverrides() {
      const a = ACCENTS[this.accent] || ACCENTS.cyan;
      return window.Vue.markRaw({
        common: {
          primaryColor: a.primary, primaryColorHover: a.hover,
          primaryColorPressed: a.pressed, primaryColorSuppl: a.primary,
          borderRadius: '10px',
        },
      });
    },
    displayName() { return this.nickname || (this.user ? this.user.email : '本地模式'); },
    activeTasks() { return this.tasks.filter(t => (t.list_id || null) === this.currentListId); },
    priorityCount() {
      if (!this.priorityFilter) return 0;
      return this.tasks.filter(t => (t.priority || 'medium') === this.priorityFilter).length;
    },
    remaining() { return this.activeTasks.filter(t => !t.completed).length; },
    doneCount() { return this.activeTasks.length - this.remaining; },
    allDone() { return this.tasks.length > 0 && this.doneCount === this.tasks.length; },
    filterDefs() {
      return [
        { key: 'all', label: '全部', count: this.tasks.length },
        { key: 'active', label: '未完成', count: this.remaining },
        { key: 'done', label: '已完成', count: this.doneCount },
      ];
    },
    allTags() {
      const map = new Map();
      this.activeTasks.forEach(t => (t.tags || []).forEach(g => map.set(g, (map.get(g) || 0) + 1)));
      return [...map.entries()].sort((a, b) => b[1] - a[1]);
    },
    /* 今日视图 */
    overdueTasks() {
      const today = todayStr();
      return this.activeTasks
        .filter(t => !t.completed && t.due_date && t.due_date < today)
        .sort((a, b) => a.due_date.localeCompare(b.due_date));
    },
    dueTodayTasks() {
      const today = todayStr();
      return this.activeTasks.filter(t => !t.completed && t.due_date === today)
        .sort((a, b) => this.sortCmp(a, b));
    },
    todayDoneCount() {
      const today = todayStr();
      return this.activeTasks.filter(t => t.completed && t.completed_at && localDateStr(t.completed_at) === today).length;
    },
    /* 列表（全部视图） */
    viewList() {
      if (this.view === 'today') return [...this.overdueTasks, ...this.dueTodayTasks];
      let list = this.activeTasks.filter(t =>
        this.filter === 'all' ? true : this.filter === 'active' ? !t.completed : t.completed);
      if (this.tagFilter) list = list.filter(t => (t.tags || []).includes(this.tagFilter));
      if (this.priorityFilter) list = list.filter(t => (t.priority || 'medium') === this.priorityFilter);
      if (this.search) {
        const q = this.search.toLowerCase();
        list = list.filter(t =>
          t.title.toLowerCase().includes(q) ||
          (t.tags || []).some(g => g.toLowerCase().includes(q)) ||
          (t.subtasks || []).some(s => s.title.toLowerCase().includes(q)));
      }
      return list.slice().sort((a, b) => this.sortCmp(a, b));
    },
    viewEmptyText() {
      if (this.view === 'today') {
        if (this.tasks.length && !this.overdueTasks.length && !this.dueTodayTasks.length)
          return '今天没有到期任务 🎉 到「全部」视图看看其他安排吧';
        return this.tasks.length ? '' : '暂无任务，添加第一个吧 ✨';
      }
      if (this.view === 'trash') return this.trashTasks.length ? '' : '回收站是空的 ♻️';
      if (this.search) return `没有匹配「${this.search}」的任务`;
      if (!this.tasks.length) return '暂无任务，添加第一个吧 ✨';
      if (this.filter === 'active') return '没有未完成的任务，太棒了 🎉';
      return '还没有已完成的任务';
    },
    /* 统计视图 */
    trend14() {
      const days = [];
      for (let i = 13; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        days.push({
          date: localDateStr(d.toISOString()),
          label: String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'),
          count: 0, isToday: i === 0,
        });
      }
      this.activeTasks.forEach(t => {
        if (t.completed && t.completed_at) {
          const ds = localDateStr(t.completed_at);
          const hit = days.find(d => d.date === ds);
          if (hit) hit.count++;
        }
      });
      return days;
    },
    maxTrend() { return Math.max(1, ...this.trend14.map(d => d.count)); },
    priorityStatsList() {
      const s = { high: 0, medium: 0, low: 0 };
      this.activeTasks.forEach(t => { s[t.priority || 'medium']++; });
      const total = Math.max(1, this.tasks.length);
      return [
        { key: 'high', label: '高优先级', count: s.high, pct: Math.round(s.high / total * 100) },
        { key: 'medium', label: '中优先级', count: s.medium, pct: Math.round(s.medium / total * 100) },
        { key: 'low', label: '低优先级', count: s.low, pct: Math.round(s.low / total * 100) },
      ];
    },
    /* 本周回顾 */
    weeklySummary() {
      const now = new Date();
      const monday = new Date(now);
      monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
      monday.setHours(0, 0, 0, 0);
      const inWeek = ts => { const t = new Date(ts).getTime(); return t >= monday.getTime(); };
      const done = this.activeTasks.filter(t => t.completed && t.completed_at && inWeek(t.completed_at)).length;
      const added = this.activeTasks.filter(t => inWeek(t.created_at)).length;
      const overdue = this.overdueTasks.length;
      const tagMap = new Map();
      this.activeTasks.filter(t => t.completed && t.completed_at && inWeek(t.completed_at))
        .forEach(t => (t.tags || []).forEach(g => tagMap.set(g, (tagMap.get(g) || 0) + 1)));
      const topTags = [...tagMap.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3).map(x => '#' + x[0]);
      const minutes = this.focusSessions().reduce((s, x) => s + x.minutes, 0);
      const p2 = n => String(n).padStart(2, '0');
      const range = `${monday.getMonth() + 1}.${monday.getDate()} - ${now.getMonth() + 1}.${now.getDate()}`;
      return { done, added, overdue, topTags, minutes, streak: this.streak, range };
    },
    /* 日历视图 */
    calGrid() {
      const cur = this.calCursor ? new Date(this.calCursor) : new Date();
      const y = cur.getFullYear(), m = cur.getMonth();
      const first = new Date(y, m, 1);
      const startOffset = (first.getDay() + 6) % 7; // 周一开头
      const days = [];
      const p2 = n => String(n).padStart(2, '0');
      const countByDate = {};
      this.activeTasks.forEach(t => {
        if (!t.due_date || t.completed) return;
        countByDate[t.due_date] = (countByDate[t.due_date] || 0) + 1;
      });
      for (let i = 0; i < 42; i++) {
        const d = new Date(y, m, 1 - startOffset + i);
        const ds = `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
        days.push({
          date: ds, day: d.getDate(), inMonth: d.getMonth() === m,
          isToday: ds === todayStr(), count: countByDate[ds] || 0,
        });
      }
      return { title: `${y} 年 ${m + 1} 月`, days };
    },
    calDayTasks() {
      if (!this.calSelected) return [];
      return this.tasks.filter(t => t.due_date === this.calSelected)
        .sort((a, b) => this.sortCmp(a, b));
    },
    emptyText() { return this.viewEmptyText; },
    syncLabel() {
      if (!this.online) return '离线';
      if (this.syncing) return '同步中…';
      if (this.pendingCount) return `待同步 ${this.pendingCount}`;
      return '已同步';
    },
    syncClass() {
      if (!this.online) return 'off';
      if (this.syncing) return 'busy';
      if (this.pendingCount) return 'pending';
      return 'ok';
    },
    syncTitle() { return this.isCloud ? '数据通过 Supabase 在你的设备间同步' : ''; },
    avatarChar() {
      const src = this.nickname || (this.user && this.user.email) || '';
      return src ? src.charAt(0).toUpperCase() : '✓';
    },
    memberSince() {
      if (!this.user || !this.user.created_at) return '';
      return new Date(this.user.created_at)
        .toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
    },
    completionRate() {
      return this.tasks.length ? Math.round(this.doneCount / this.tasks.length * 100) : 0;
    },
    listOptions() {
      return [{ label: '📋 默认清单', value: '__default__' }]
        .concat(this.lists.map(l => ({ label: '📁 ' + l.name, value: l.id })));
    },
    currentListValue: {
      get() { return this.currentListId || '__default__'; },
      set(v) { this.switchList(v === '__default__' ? null : v); },
    },
  },

  watch: {
    tasks: {
      handler() {
        this.calcStreak();
        if (this.isCloud && this.user) this.writeCache();
        else this.saveLocal();

      deep: true,

  },

  async mounted() {
    window.addEventListener('online', () => { this.online = true; this.flushQueue(); });
    window.addEventListener('offline', () => { this.online = false; });

    // 外观三档 + 主题色
    try {
      this.appearance = localStorage.getItem('todo.appearance') || 'auto';
      this.accent = ACCENTS[localStorage.getItem('todo.accent')] ? localStorage.getItem('todo.accent') : 'cyan';
    } catch (e) {}
    this.applyAppearance();
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (this.appearance === 'auto') this.applyAppearance();
    });

    // 全局粘贴截图 / 键盘快捷键
    document.addEventListener('paste', (e) => this.onPaste(e));
    document.addEventListener('keydown', (e) => this.onShortcut(e));

    // 模板 / AI key
    try {
      this.templates = JSON.parse(localStorage.getItem('todo.templates') || '[]');
      this.aiKey = localStorage.getItem('todo.aikey') || '';
    } catch (e) {}

    if (this.isCloud) {
      this.sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
      const { data: { session } } = await this.sb.auth.getSession();
      if (session && session.user) await this.onSignedIn(session.user);
      this.sb.auth.onAuthStateChange((evt, session) => {
        if (evt === 'SIGNED_OUT') this.onSignedOut();
        else if (evt === 'SIGNED_IN' && session && !this.user) this.onSignedIn(session.user);
        else if (evt === 'USER_UPDATED' && session) this.user = session.user;
        else if (evt === 'TOKEN_REFRESHED' && session) this.user = session.user;
      });
      setInterval(() => { if (navigator.onLine) this.flushQueue(); }, 30000);
    } else {
      this.loadLocalAll();
      try {
        this.nickname = localStorage.getItem('todo.nickname') || '';
        this.avatarUrl = localStorage.getItem('todo.avatar') || '';
        this.nicknameDraft = this.nickname;
      } catch (e) {}
    }

    // 回收站自动清理（30 天）
    this.purgeOldTrash();

    // 到期提醒：启动后 5 秒查一次，之后每分钟检查
    setTimeout(() => this.checkReminders(), 5000);
    setInterval(() => this.checkReminders(), 60000);
  },

  methods: {
    /* ---------------- 外观 / 主题色 ---------------- */
    applyAppearance() {
      const dark = this.appearance === 'dark' ||
        (this.appearance === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      this.uiDark = dark;
      document.documentElement.classList.toggle('dark', dark);
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = dark ? '#05070f' : '#f4f6fb';
    },
    setAppearance(v) {
      this.appearance = v;
      try { localStorage.setItem('todo.appearance', v); } catch (e) {}
      this.applyAppearance();
    },
    setAccent(a) {
      this.accent = a;
      try { localStorage.setItem('todo.accent', a); } catch (e) {}
      document.documentElement.setAttribute('data-accent', a);
      this.showToast('🎨 主题色已切换');
    },

    /* ---------------- 键盘快捷键 ---------------- */
    onShortcut(e) {
      const t = e.target;
      const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
      if (e.key === 'Escape') {
        if (this.imagePreview) { this.imagePreview = null; return; }
        if (this.showProfile) { this.closeProfile(); return; }
        if (typing) t.blur();
        return;
      }
      if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === 'n' || e.key === 'N') {
        e.preventDefault();
        const el = document.querySelector('.add-form input');
        if (el) { el.focus(); }
      } else if (e.key === '/') {
        e.preventDefault();
        this.view = 'all';
        this.$nextTick(() => {
          const el = document.querySelector('.search-input input');
          if (el) el.focus();
        });
      } else if (['1', '2', '3', '4'].includes(e.key)) {
        const views = ['today', 'all', 'calendar', 'stats'];
        this.view = views[+e.key - 1];
      }
    },

    /* ---------------- 排序 / 展示 ---------------- */
    sortCmp(a, b) {
      if (a.completed !== b.completed) return a.completed ? 1 : -1; // 未完成在前
      const ao = a.sort_order != null ? a.sort_order : (a.created_at ? new Date(a.created_at).getTime() : 0);
      const bo = b.sort_order != null ? b.sort_order : (b.created_at ? new Date(b.created_at).getTime() : 0);
      if (this.sortBy === 'manual') return ao - bo;
      const createdCmp = (b.created_at || '').localeCompare(a.created_at || '');
      if (this.sortBy === 'created') return createdCmp;
      if (this.sortBy === 'due') {
        if (!a.due_date && !b.due_date) return createdCmp;
        if (!a.due_date) return 1;
        if (!b.due_date) return -1;
        return a.due_date.localeCompare(b.due_date) || createdCmp;
      }
      // 智能排序：优先级 → 截止日期 → 创建时间
      const pa = PRIORITY_WEIGHT[a.priority] ?? 1, pb = PRIORITY_WEIGHT[b.priority] ?? 1;
      if (pa !== pb) return pa - pb;
      if (!!a.due_date !== !!b.due_date) return a.due_date ? -1 : 1;
      if (a.due_date && a.due_date !== b.due_date) return a.due_date.localeCompare(b.due_date);
      return createdCmp;
    },

    priorityLabel(p) { return PRIORITY_LABELS[p] || '中优先级'; },
    repeatLabel(r) { return REPEAT_LABELS[r] || ''; },

    isOverdue(task) {
      return !!task.due_date && !task.completed && task.due_date < todayStr();
    },

    dueClass(task) {
      if (this.isOverdue(task)) return 'overdue';
      if (task.due_date) {
        const d = daysBetween(todayStr(), task.due_date);
        if (d >= 0 && d <= 2) return 'soon';
      }
      return '';
    },

    dueLabel(task) {
      const today = todayStr();
      if (task.due_date < today) {
        const late = daysBetween(task.due_date, today);
        return task.completed ? `截止 ${task.due_date}` : `已逾期 ${late} 天`;
      }
      if (task.due_date === today) return '今天到期';
      const d = daysBetween(today, task.due_date);
      if (d === 1) return '明天到期';
      return `${d} 天后到期`;
    },

    fmtRemind(iso) {
      const d = new Date(iso), p = n => String(n).padStart(2, '0');
      return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    },

    toLocalInputValue(iso) {
      if (!iso) return '';
      const d = new Date(iso), p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    },

    parseLocalDateTime(s) { // 'yyyy-MM-dd HH:mm'（n-date-picker 的值）→ ISO
      return s ? new Date(s.replace(' ', 'T')).toISOString() : null;
    },

    showToast(msg) {
      this.toast = msg;
      clearTimeout(this._toastTimer);
      this._toastTimer = setTimeout(() => { this.toast = ''; }, 2600);
    },

    /* ---------------- 打卡 streak ---------------- */
    calcStreak() {
      const days = new Set(this.activeTasks
        .filter(t => t.completed && t.completed_at)
        .map(t => localDateStr(t.completed_at)));
      let streak = 0;
      const d = new Date();
      if (!days.has(localDateStr(d.toISOString()))) d.setDate(d.getDate() - 1); // 今天还没完成不打断
      while (days.has(localDateStr(d.toISOString()))) { streak++; d.setDate(d.getDate() - 1); }
      this.streak = streak;
    },

    /* ---------------- AI 自然语言解析（规则引擎 + 可选 LLM）---------------- */
    parseNaturalLanguage(raw) {
      let text = ' ' + raw + ' ';
      const out = { title: raw, priority: null, dueDate: null, remindAt: null, tags: [], repeat: null };
      const today = new Date();
      const p2 = n => String(n).padStart(2, '0');
      const fmt = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
      const addDays = n => { const d = new Date(today); d.setDate(d.getDate() + n); return d; };
      let m;
      // 优先级
      if (/高优先|紧急|重要/.test(text)) out.priority = 'high';
      else if (/低优先|不急/.test(text)) out.priority = 'low';
      else if (/中优先/.test(text)) out.priority = 'medium';
      text = text.replace(/(高|中|低)优先级?|紧急|重要|不急/g, ' ');
      // 重复
      if (/每天|每日/.test(text)) out.repeat = 'daily';
      else if (/每周/.test(text)) out.repeat = 'weekly';
      else if (/每月/.test(text)) out.repeat = 'monthly';
      text = text.replace(/每天|每日|每周|每月/g, ' ');
      // 日期
      const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
      if (/今天|今晚/.test(text)) { out.dueDate = fmt(today); text = text.replace(/今天|今晚/g, ' '); }
      else if (/明天/.test(text)) { out.dueDate = fmt(addDays(1)); text = text.replace(/明天/g, ' '); }
      else if (/后天/.test(text)) { out.dueDate = fmt(addDays(2)); text = text.replace(/后天/g, ' '); }
      else if ((m = text.match(/大后天/))) { out.dueDate = fmt(addDays(3)); text = text.replace(/大后天/g, ' '); }
      else if ((m = text.match(/下?周([一二三四五六日天])/))) {
        const idx = weekdays.indexOf(m[1] === '天' ? '日' : m[1]);
        let delta = (idx - today.getDay() + 7) % 7;
        if (m[0].startsWith('下')) delta += 7;
        if (delta === 0) delta = 7;
        out.dueDate = fmt(addDays(delta));
        text = text.replace(m[0], ' ');
      }
      else if ((m = text.match(/(\d{1,2})月(\d{1,2})[日号]/))) {
        const d = new Date(today.getFullYear(), +m[1] - 1, +m[2]);
        if (d < today) d.setFullYear(d.getFullYear() + 1);
        out.dueDate = fmt(d);
        text = text.replace(m[0], ' ');
      }
      else if ((m = text.match(/(\d{1,3})[天日]后/))) { out.dueDate = fmt(addDays(+m[1])); text = text.replace(m[0], ' '); }
      else if ((m = text.match(/(\d{4})-(\d{1,2})-(\d{1,2})/))) { out.dueDate = `${m[1]}-${p2(m[2])}-${p2(m[3])}`; text = text.replace(m[0], ' '); }
      // 提醒时间（默认作用于到期日当天）
      if ((m = text.match(/(上午|早上|中午|下午|晚上)?\s*(\d{1,2})[:：点时](\d{1,2})?分?/))) {
        let h = +m[2]; const min = m[3] ? +m[3] : 0;
        if ((m[1] === '下午' || m[1] === '晚上') && h < 12) h += 12;
        if ((m[1] === '上午' || m[1] === '早上') && h === 12) h = 0;
        const base = out.dueDate || fmt(today);
        out.remindAt = `${base} ${p2(h)}:${p2(min)}`;
        text = text.replace(/提醒我?|提醒/g, ' ').replace(m[0], ' ');
      }
      // 标签
      const tags = [...text.matchAll(/#([^\s#,，、]+)/g)].map(x => x[1]);
      if (tags.length) { out.tags = tags.slice(0, 3); text = text.replace(/#[^\s#,，、]+/g, ' '); }
      out.title = text.replace(/\s{2,}/g, ' ').trim() || raw;
      return out;
    },

    async smartParse() {
      const raw = (this.newTask.title || '').trim();
      if (!raw) { this.showToast('先输入内容再点 ✨ 解析'); return; }
      let parsed;
      if (this.aiKey) {
        this.aiBusy = true;
        try { parsed = await this.llmParse(raw); } catch (e) { parsed = null; }
        this.aiBusy = false;
      }
      if (!parsed) parsed = this.parseNaturalLanguage(raw);
      this.newTask.title = parsed.title;
      if (parsed.priority) this.newTask.priority = parsed.priority;
      if (parsed.dueDate) this.newTask.dueDate = parsed.dueDate;
      if (parsed.remindAt) { this.newTask.remindAt = parsed.remindAt; this.showMore = true; }
      if (parsed.repeat) { this.newTask.repeat = parsed.repeat; this.showMore = true; }
      if (parsed.tags && parsed.tags.length) {
        this.newTask.tagsText = parsed.tags.join(', ');
        this.showMore = true;
      }
      const bits = [
        parsed.dueDate ? '📅 ' + parsed.dueDate : '',
        parsed.priority ? this.priorityLabel(parsed.priority) : '',
        parsed.remindAt ? '🔔 ' + parsed.remindAt : '',
        parsed.repeat ? '🔁 ' + this.repeatLabel(parsed.repeat) : '',
      ].filter(Boolean);
      this.showToast(bits.length ? '✨ 已识别：' + bits.join(' · ') : '✨ 已整理标题（没识别到日期/优先级）');
    },

    async llmParse(raw) {
      const res = await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${this.aiKey}` },
        body: JSON.stringify({
          model: 'glm-4-flash',
          messages: [
            { role: 'system', content: '你是待办清单解析器。把用户的话解析成 JSON：{"title":string,"priority":"high|medium|low|null","due_date":"YYYY-MM-DD|null","remind_at":"YYYY-MM-DD HH:mm|null","tags":[],"repeat":"daily|weekly|monthly|null"}。今天是' + todayStr() + '。只输出 JSON，不要多余文字。' },
            { role: 'user', content: raw },
          ],
          temperature: 0.1,
        }),
      });
      if (!res.ok) throw new Error('LLM ' + res.status);
      const data = await res.json();
      const json = JSON.parse((data.choices[0].message.content || '').replace(/```json|```/g, '').trim());
      return {
        title: json.title || raw,
        priority: ['high', 'medium', 'low'].includes(json.priority) ? json.priority : null,
        dueDate: /^\d{4}-\d{2}-\d{2}$/.test(json.due_date || '') ? json.due_date : null,
        remindAt: /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(json.remind_at || '') ? json.remind_at : null,
        tags: Array.isArray(json.tags) ? json.tags.filter(x => typeof x === 'string').slice(0, 3) : [],
        repeat: ['daily', 'weekly', 'monthly'].includes(json.repeat) ? json.repeat : null,
      };
    },

    saveAiKey() {
      this.aiKey = (this.aiKey || '').trim();
      try { localStorage.setItem('todo.aikey', this.aiKey); } catch (e) {}
      this.showToast(this.aiKey ? '✅ AI Key 已保存（智谱 glm-4-flash）' : '已清空，使用内置规则解析');
    },

    /* ---------------- 语音输入 ---------------- */
    toggleVoice() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { this.showToast('当前浏览器不支持语音识别（推荐 Chrome/Edge）'); return; }
      if (this._rec) { this._rec.stop(); return; }
      const rec = new SR();
      rec.lang = 'zh-CN';
      rec.interimResults = false;
      rec.onresult = (e) => {
        const t = e.results[0][0].transcript;
        this.newTask.title = t;
        this.smartParse(); // 语音内容自动解析
      };
      rec.onend = () => { this.listening = false; this._rec = null; };
      rec.onerror = () => { this.listening = false; this._rec = null; this.showToast('语音识别结束/失败'); };
      this._rec = rec;
      this.listening = true;
      this.showToast('🎙 正在聆听…请说话');
      rec.start();
    },

    /* ---------------- 番茄钟 ---------------- */
    startPomo(task) {
      this.stopPomo(true);
      this.pomo = { taskId: task.id, title: task.title, total: 25 * 60, left: 25 * 60, running: true };
      this._pomoTimer = setInterval(() => {
        if (!this.pomo.running) return;
        this.pomo.left--;
        if (this.pomo.left <= 0) this.finishPomo();
      }, 1000);
      this.showToast('🍅 番茄钟开始：25 分钟专注');
    },
    togglePomoPause() { this.pomo.running = !this.pomo.running; },
    stopPomo(silent) {
      clearInterval(this._pomoTimer);
      const wasRunning = !!this.pomo.taskId;
      this.pomo = { taskId: null, title: '', total: 25 * 60, left: 25 * 60, running: false };
      if (wasRunning && !silent) this.showToast('番茄钟已取消');
    },
    finishPomo() {
      clearInterval(this._pomoTimer);
      const sessions = this.focusSessions();
      sessions.push({ task_title: this.pomo.title, minutes: 25, ended_at: new Date().toISOString() });
      try { localStorage.setItem(this.storageKey('focus'), JSON.stringify(sessions.slice(-200))); } catch (e) {}
      try { new Notification('🍅 番茄钟完成！', { body: '专注 25 分钟，休息一下吧' }); } catch (e) {}
      this.showToast('🍅 专注 25 分钟完成，已记录！');
      this.pomo = { taskId: null, title: '', total: 25 * 60, left: 25 * 60, running: false };
    },
    focusSessions() {
      try { return JSON.parse(localStorage.getItem(this.storageKey('focus')) || '[]'); } catch (e) { return []; }
    },
    pomoClock() {
      const m = Math.floor(this.pomo.left / 60), s = this.pomo.left % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    },
    pomoPct() {
      return Math.round((1 - this.pomo.left / this.pomo.total) * 100);
    },

    /* ---------------- 模板 ---------------- */
    saveTemplateFromTask(task) {
      const tpl = {
        id: uuid(), name: task.title.slice(0, 20),
        title: task.title, priority: task.priority || 'medium',
        repeat: task.repeat || '', tagsText: (task.tags || []).join(', '),
        subtasks: (task.subtasks || []).map(s => s.title),
      };
      this.templates.unshift(tpl);
      try { localStorage.setItem('todo.templates', JSON.stringify(this.templates)); } catch (e) {}
      this.showToast('📋 已存为模板：' + tpl.name);
    },
    applyTemplate(tpl) {
      this.newTask = {
        title: tpl.title, priority: tpl.priority || 'medium',
        dueDate: null, remindAt: null, tagsText: tpl.tagsText || '', repeat: tpl.repeat || '',
      };
      this._pendingSubtasks = tpl.subtasks || [];
      this.showTplMenu = false;
      this.showToast('📋 模板已填入，回车添加');
    },
    deleteTemplate(id) {
      this.templates = this.templates.filter(t => t.id !== id);
      try { localStorage.setItem('todo.templates', JSON.stringify(this.templates)); } catch (e) {}
    },

    /* ---------------- 多清单 ---------------- */
    async loadLists() {
      if (this.isCloud && this.user) {
        const { data, error } = await this.sb.from('lists').select('*').order('created_at');
        if (!error) this.lists = (data || []).map(l => ({ id: l.id, name: l.name }));
      } else {
        try { this.lists = JSON.parse(localStorage.getItem('todo.lists') || '[]'); } catch (e) {}
      }
      try { this.currentListId = localStorage.getItem(this.storageKey('currentList')) || null; } catch (e) {}
      if (this.currentListId && !this.lists.some(l => l.id === this.currentListId)) this.currentListId = null;
    },
    async createList() {
      const name = this.newListName.trim().slice(0, 12);
      if (!name) return;
      let id = uuid();
      if (this.isCloud && this.user) {
        const { data, error } = await this.sb.from('lists').insert({ id, user_id: this.user.id, name }).select();
        if (error) { this.showToast('创建失败：' + error.message); return; }
      }
      this.lists.push({ id, name });
      try { localStorage.setItem('todo.lists', JSON.stringify(this.lists)); } catch (e) {}
      this.newListName = '';
      this.showNewListInput = false;
      this.switchList(id);
      this.showToast('📁 清单「' + name + '」已创建');
    },
    async switchList(id) {
      this.currentListId = id;
      try { localStorage.setItem(this.storageKey('currentList'), id || ''); } catch (e) {}
      if (this.isCloud && this.user) await this.loadTasks();
    },
    async deleteCurrentList() {
      if (!this.currentListId) return;
      const list = this.lists.find(l => l.id === this.currentListId);
      if (!list) return;
      if (this._listDelArmed !== list.id) {
        this._listDelArmed = list.id;
        this.showToast('⚠ 再点一次删除清单「' + list.name + '」（任务移回默认清单）');
        clearTimeout(this._listDelTimer);
        this._listDelTimer = setTimeout(() => { this._listDelArmed = null; }, 3000);
        return;
      }
      clearTimeout(this._listDelTimer);
      this._listDelArmed = null;
      const moved = this.tasks.filter(t => t.list_id === this.currentListId);
      moved.forEach(t => { t.list_id = null; t.updated_at = new Date().toISOString(); });
      this.tasks = [...this.tasks];
      this.lists = this.lists.filter(l => l.id !== this.currentListId);
      try { localStorage.setItem('todo.lists', JSON.stringify(this.lists)); } catch (e) {}
      if (this.isCloud && this.user) {
        moved.forEach(t => this.cloudMutate('upsert', t));
        await this.sb.from('lists').delete().eq('id', this.currentListId).then(() => {}, () => {});
      }
      this.switchList(null);
      this.showToast('清单已删除，' + moved.length + ' 项任务移回默认清单');
    },

    /* ---------------- 日历 ---------------- */
    calPrevMonth() {
      const d = this.calCursor ? new Date(this.calCursor) : new Date();
      d.setMonth(d.getMonth() - 1);
      this.calCursor = d.getTime();
    },
    calNextMonth() {
      const d = this.calCursor ? new Date(this.calCursor) : new Date();
      d.setMonth(d.getMonth() + 1);
      this.calCursor = d.getTime();
    },

    /* ---------------- 本周回顾分享卡片 ---------------- */
    buildWeeklyCard() {
      const w = this.weeklySummary;
      const canvas = document.createElement('canvas');
      canvas.width = 900; canvas.height = 1200;
      const ctx = canvas.getContext('2d');
      const accent = ACCENTS[this.accent] || ACCENTS.cyan;
      // 背景：深空渐变 + 网格
      const bg = ctx.createLinearGradient(0, 0, 900, 1200);
      bg.addColorStop(0, '#0b1226'); bg.addColorStop(1, '#05070f');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, 900, 1200);
      ctx.strokeStyle = 'rgba(148,163,184,.08)'; ctx.lineWidth = 1;
      for (let x = 0; x < 900; x += 45) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1200); ctx.stroke(); }
      for (let y = 0; y < 1200; y += 45) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(900, y); ctx.stroke(); }
      const glow = ctx.createRadialGradient(160, 120, 0, 160, 120, 420);
      glow.addColorStop(0, accent.glow.replace(/[\d.]+\)$/, '.35)')); glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow; ctx.fillRect(0, 0, 900, 700);
      // 标题
      ctx.fillStyle = '#fff'; ctx.font = 'bold 52px "Microsoft YaHei", sans-serif';
      ctx.fillText('✅ 待办清单 · 本周回顾', 70, 130);
      ctx.fillStyle = 'rgba(226,232,240,.55)'; ctx.font = '26px "Microsoft YaHei", sans-serif';
      ctx.fillText(w.range, 70, 180);
      // 大数字
      const stats = [
        [String(w.done), '完成任务', accent.primary],
        [String(w.added), '新建任务', '#818cf8'],
        [w.minutes ? String(w.minutes) + '′' : '—', '番茄专注', '#f59e0b'],
        [w.streak ? w.streak + ' 天' : '—', '连续打卡', '#f97316'],
      ];
      stats.forEach(([num, label, color], i) => {
        const x = 70 + (i % 2) * 400, y = 280 + Math.floor(i / 2) * 220;
        ctx.fillStyle = 'rgba(255,255,255,.04)';
        this.roundRect(ctx, x, y, 360, 180, 20); ctx.fill();
        ctx.strokeStyle = 'rgba(148,163,184,.2)'; this.roundRect(ctx, x, y, 360, 180, 20); ctx.stroke();
        ctx.fillStyle = color; ctx.font = 'bold 72px "Microsoft YaHei", sans-serif';
        ctx.fillText(num, x + 30, y + 90);
        ctx.fillStyle = 'rgba(226,232,240,.7)'; ctx.font = '26px "Microsoft YaHei", sans-serif';
        ctx.fillText(label, x + 30, y + 140);
      });
      // 逾期与标签
      ctx.fillStyle = w.overdue ? '#fb7185' : '#34d399';
      ctx.font = '30px "Microsoft YaHei", sans-serif';
      ctx.fillText(w.overdue ? `⚠ 还有 ${w.overdue} 项逾期未完成` : '🎉 本周无逾期任务', 70, 790);
      ctx.fillStyle = 'rgba(226,232,240,.85)'; ctx.font = '28px "Microsoft YaHei", sans-serif';
      ctx.fillText(w.topTags.length ? '高频标签：' + w.topTags.join(' · ') : '本周还没有标签', 70, 850);
      // 底部
      const grad = ctx.createLinearGradient(70, 0, 480, 0);
      grad.addColorStop(0, accent.primary); grad.addColorStop(1, accent.accent2);
      ctx.fillStyle = grad; ctx.font = 'bold 26px "Microsoft YaHei", sans-serif';
      ctx.fillText('fishtodo.netlify.app', 70, 1130);
      canvas.toBlob((blob) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'todo-weekly-' + todayStr() + '.png';
        a.click();
        URL.revokeObjectURL(a.href);
      }, 'image/png');
      this.showToast('🖼 分享卡片已生成下载');
    },
    roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    },

    /* ---------------- 拖拽排序 ---------------- */
    onDragStart(task, e) {
      this.dragId = task.id;
      if (e && e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', task.id); }
    },
    onDragEnd() { this.dragId = null; },
    onDropOn(target) {
      const srcId = this.dragId;
      this.dragId = null;
      if (!srcId || srcId === target.id) return;
      const manual = this.viewList; // 已按当前排序的列表
      const ti = manual.findIndex(t => t.id === target.id);
      const src = this.tasks.find(t => t.id === srcId);
      if (!src || ti < 0) return;
      const si = manual.findIndex(t => t.id === srcId);
      const above = si < ti ? manual[ti - 1] : manual[ti];      // 插入位置前一项
      const below = si < ti ? manual[ti] : manual[ti + 1];      // 插入位置后一项
      const aOrd = above ? (above.sort_order != null ? above.sort_order : new Date(above.created_at).getTime()) : null;
      const bOrd = below ? (below.sort_order != null ? below.sort_order : new Date(below.created_at).getTime()) : null;
      let ord;
      if (aOrd == null && bOrd != null) ord = bOrd - 1;
      else if (bOrd == null && aOrd != null) ord = aOrd + 1;
      else if (aOrd != null && bOrd != null) ord = (aOrd + bOrd) / 2;
      else ord = Date.now();
      src.sort_order = ord;
      src.updated_at = new Date().toISOString();
      // 数组内移动
      const from = this.tasks.findIndex(t => t.id === srcId);
      this.tasks.splice(from, 1);
      const to = this.tasks.findIndex(t => t.id === target.id);
      this.tasks.splice(si < ti ? to + 1 : to, 0, src);
      if (this.isCloud && this.user) this.cloudMutate('upsert', src);
    },

    /* ---------------- 本地增删改 ---------------- */
    addTask() {
      if (!this.newTask.title) return;
      const now = new Date().toISOString();
      const task = {
        id: uuid(),
        title: this.newTask.title,
        completed: false,
        priority: this.newTask.priority,
        due_date: this.newTask.dueDate || null,
        remind_at: this.parseLocalDateTime(this.newTask.remindAt),
        repeat: this.newTask.repeat || null,
        tags: this.parseTags(this.newTask.tagsText),
        subtasks: (this._pendingSubtasks || []).map(s => ({ id: uuid(), title: s, done: false })),
        image: null,
        list_id: this.currentListId,
        sort_order: Date.now(),
        created_at: now,
        updated_at: now,
        completed_at: null,
        deleted_at: null,
      };
      this._pendingSubtasks = [];
      this.tasks.unshift(task);
      this.newTask = { title: '', priority: 'medium', dueDate: null, remindAt: null, tagsText: '', repeat: '' };
      this.showMore = false;
      if (this.isCloud && this.user) this.cloudMutate('upsert', task);
    },

    toggleTask(task) {
      task.completed = !task.completed;
      task.completed_at = task.completed ? new Date().toISOString() : null;
      task.updated_at = new Date().toISOString();
      let next = null;
      if (task.completed && task.repeat) next = this.nextOccurrence(task);
      if (this.isCloud && this.user) {
        this.cloudMutate('upsert', task);
        if (next) this.cloudMutate('upsert', next);
      }
      if (next) {
        this.tasks.unshift(next);
        this.showToast(`🔁 已生成下一期：${next.due_date}`);
      }
    },

    nextOccurrence(task) {
      const now = new Date().toISOString();
      return {
        ...task,
        id: uuid(),
        completed: false,
        completed_at: null,
        created_at: now,
        updated_at: now,
        due_date: this.advanceDate(task.due_date, task.repeat),
        remind_at: task.remind_at ? this.advanceDateTime(task.remind_at, task.repeat) : null,
        subtasks: (task.subtasks || []).map(s => ({ id: uuid(), title: s.title, done: false })),
      };
    },

    advanceDate(dateStr, repeat) {
      const d = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
      if (repeat === 'daily') d.setDate(d.getDate() + 1);
      else if (repeat === 'weekly') d.setDate(d.getDate() + 7);
      else if (repeat === 'monthly') d.setMonth(d.getMonth() + 1);
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    },

    advanceDateTime(iso, repeat) {
      const d = new Date(iso);
      if (repeat === 'daily') d.setDate(d.getDate() + 1);
      else if (repeat === 'weekly') d.setDate(d.getDate() + 7);
      else if (repeat === 'monthly') d.setMonth(d.getMonth() + 1);
      return d.toISOString();
    },

    /* 软删除 → 回收站（30 天可恢复） */
    removeTask(task) {
      task.deleted_at = new Date().toISOString();
      this.tasks = this.tasks.filter(t => t.id !== task.id);
      this.trashTasks.unshift(task);
      if (this.editingId === task.id) this.editingId = null;
      if (this.isCloud && this.user) this.cloudMutate('upsert', task);
      this.showToast('🗑 已移入回收站（30 天内可恢复）');
    },

    restoreTask(task) {
      task.deleted_at = null;
      task.updated_at = new Date().toISOString();
      this.trashTasks = this.trashTasks.filter(t => t.id !== task.id);
      this.tasks.unshift(task);
      if (this.isCloud && this.user) this.cloudMutate('upsert', task);
      this.showToast('✅ 已恢复：' + task.title);
    },

    purgeTask(task) { // 彻底删除
      this.trashTasks = this.trashTasks.filter(t => t.id !== task.id);
      if (this.isCloud && this.user) this.cloudMutate('delete', task);
      this.showToast('已彻底删除');
    },

    clearTrash() {
      if (!this.trashTasks.length) return;
      const all = [...this.trashTasks];
      this.trashTasks = [];
      if (this.isCloud && this.user) all.forEach(t => this.cloudMutate('delete', t));
      this.showToast(`已清空回收站（${all.length} 项）`);
    },

    purgeOldTrash() {
      const cutoff = Date.now() - 30 * 86400000;
      const expired = this.trashTasks.filter(t => t.deleted_at && new Date(t.deleted_at).getTime() < cutoff);
      if (!expired.length) return;
      this.trashTasks = this.trashTasks.filter(t => !expired.includes(t));
      if (this.isCloud && this.user) expired.forEach(t => this.cloudMutate('delete', t));
    },

    toggleAll() {
      const target = !this.allDone;
      const changed = this.activeTasks.filter(t => t.completed !== target);
      const now = new Date().toISOString();
      changed.forEach(t => {
        t.completed = target;
        t.completed_at = target ? now : null;
        t.updated_at = now;
      });
      if (this.isCloud && this.user) changed.forEach(t => this.cloudMutate('upsert', t));
    },

    clearCompleted() {
      const done = this.activeTasks.filter(t => t.completed);
      if (!done.length) return;
      const now = new Date().toISOString();
      done.forEach(t => { t.deleted_at = now; });
      this.tasks = this.tasks.filter(t => !t.completed);
      this.trashTasks.unshift(...done);
      if (this.isCloud && this.user) done.forEach(t => this.cloudMutate('upsert', t));
      this.showToast(`已清除 ${done.length} 项（可在回收站恢复）`);
    },

    /* ---------------- 标签 ---------------- */
    parseTags(text) {
      return [...new Set(String(text || '').split(/[,，、\s]+/).map(s => s.trim()).filter(Boolean))].slice(0, 5);
    },

    setTagFilter(tag) {
      if (this.tagFilter === tag) { this.tagFilter = ''; return; }
      this.tagFilter = tag;
      this.view = 'all';
    },

    setPriorityFilter(p) {
      this.priorityFilter = this.priorityFilter === p ? '' : p;
      this.view = 'all';
    },

    jumpFilter(key) {
      this.view = 'all';
      this.filter = key;
    },

    /* ---------------- 子任务 ---------------- */
    toggleExpand(id) {
      this.expanded = { ...this.expanded, [id]: !this.expanded[id] };
    },

    doneSubCount(task) {
      return (task.subtasks || []).filter(s => s.done).length;
    },

    addSubtask(task) {
      const title = (this.subtaskDraft[task.id] || '').trim();
      if (!title) return;
      task.subtasks = [...(task.subtasks || []), { id: uuid(), title, done: false }];
      task.updated_at = new Date().toISOString();
      this.subtaskDraft = { ...this.subtaskDraft, [task.id]: '' };
      if (this.isCloud && this.user) this.cloudMutate('upsert', task);
    },

    toggleSubtask(task, sub) {
      sub.done = !sub.done;
      task.updated_at = new Date().toISOString();
      if (this.isCloud && this.user) this.cloudMutate('upsert', task);
    },

    removeSubtask(task, sub) {
      task.subtasks = task.subtasks.filter(s => s.id !== sub.id);
      task.updated_at = new Date().toISOString();
      if (this.isCloud && this.user) this.cloudMutate('upsert', task);
    },

    /* ---------------- 截图待办 / 头像 ---------------- */
    onPaste(e) {
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      const items = (e.clipboardData && e.clipboardData.items) || [];
      for (const it of items) {
        if (it.kind === 'file' && it.type && it.type.startsWith('image/')) {
          const file = it.getAsFile();
          if (file) { e.preventDefault(); this.addImageTask(file); }
          return;
        }
      }
    },

    compressImage(file, maxDim = 1280, quality = 0.82) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          canvas.toBlob((blob) => {
            URL.revokeObjectURL(url);
            resolve({ dataUrl, blob: blob || null });
          }, 'image/jpeg', quality);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
        img.src = url;
      });
    },

    async addImageTask(file) {
      try {
        this.showToast('📷 正在处理截图…');
        const { dataUrl, blob } = await this.compressImage(file);
        const now = new Date().toISOString();
        const task = {
          id: uuid(),
          title: '截图任务',
          completed: false,
          priority: 'medium',
          due_date: null,
          remind_at: null,
          repeat: null,
          tags: ['截图'],
          subtasks: [],
          image: dataUrl,
          list_id: this.currentListId,
          sort_order: Date.now(),
          created_at: now,
          updated_at: now,
          completed_at: null,
          deleted_at: null,
        };
        if (this.isCloud && this.user) {
          try {
            const path = this.user.id + '/' + task.id + '.jpg';
            const { error } = await this.sb.storage.from('todo_images')
              .upload(path, blob, { contentType: 'image/jpeg', upsert: true });
            if (!error) {
              const { data } = this.sb.storage.from('todo_images').getPublicUrl(path);
              task.image = data.publicUrl;
            }
          } catch (e) { /* Storage 未配置等情况：保留 dataUrl */ }
        }
        this.tasks.unshift(task);
        if (this.isCloud && this.user) this.cloudMutate('upsert', task);
        this.showToast('📷 截图已添加为待办');
      } catch (e) {
        this.showToast('截图处理失败：' + ((e && e.message) || e));
      }
    },

    removeImage(task) {
      task.image = null;
      task.updated_at = new Date().toISOString();
      if (this.isCloud && this.user) this.cloudMutate('upsert', task);
      this.showToast('已移除截图');
    },

    openImage(url) { this.imagePreview = url; },

    pickAvatar() {
      const input = this.$refs.avatarInput;
      if (input) input.click();
    },

    async onAvatarPicked(e) {
      const file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!file) return;
      if (!/^image\//.test(file.type)) { this.showToast('请选择图片文件'); return; }
      try {
        const { dataUrl } = await this.compressImage(file, 256, 0.85);
        this.avatarUrl = dataUrl;
        if (this.isCloud && this.user) {
          const { data, error } = await this.sb.auth.updateUser({ data: { avatar_url: dataUrl } });
          if (error) throw error;
          if (data && data.user) this.user = data.user;
        } else {
          try { localStorage.setItem('todo.avatar', dataUrl); } catch (err) {}
        }
        this.showToast('✅ 头像已更新');
      } catch (e) {
        this.showToast('头像保存失败：' + ((e && e.message) || e));
      }
    },

    async saveNickname() {
      const name = this.nicknameDraft.trim().slice(0, 20);
      if (!name) { this.showToast('昵称不能为空'); return; }
      this.nickname = name;
      if (this.isCloud && this.user) {
        try {
          const { data, error } = await this.sb.auth.updateUser({ data: { nickname: name } });
          if (error) throw error;
          if (data && data.user) this.user = data.user;
        } catch (e) { this.showToast('昵称保存失败：' + ((e && e.message) || e)); return; }
      } else {
        try { localStorage.setItem('todo.nickname', name); } catch (e) {}
      }
      this.showToast('✅ 昵称已保存');
    },

    /* ---------------- 个人信息面板 ---------------- */
    closeProfile() {
      this.showProfile = false;
      this.showPwdForm = false;
      this.pwdMsg = null;
      this.clearArmed = false;
    },

    async changePassword() {
      if (this.pwdForm.newPwd.length < 6) {
        this.pwdMsg = { ok: false, text: '密码至少需要 6 位' };
        return;
      }
      if (this.pwdForm.newPwd !== this.pwdForm.confirm) {
        this.pwdMsg = { ok: false, text: '两次输入的密码不一致' };
        return;
      }
      try {
        const { error } = await this.sb.auth.updateUser({ password: this.pwdForm.newPwd });
        if (error) throw error;
        this.pwdMsg = { ok: true, text: '✅ 密码已修改' };
        this.pwdForm = { newPwd: '', confirm: '' };
        setTimeout(() => { this.showPwdForm = false; this.pwdMsg = null; }, 2000);
      } catch (e) {
        const msg = (e && e.message) || String(e);
        this.pwdMsg = {
          ok: false,
          text: /at least 6/i.test(msg) ? '密码至少需要 6 位'
            : /Failed to fetch|NetworkError|fetch failed/i.test(msg) ? '网络错误，请稍后重试'
            : '修改失败：' + msg,
        };
      }
    },

    exportTasks() {
      if (!this.tasks.length) { this.showToast('暂无任务可导出'); return; }
      const data = JSON.stringify({
        app: '待办清单', exported_at: new Date().toISOString(),
        account: this.user ? this.user.email : 'local', tasks: this.tasks,
      }, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'todo-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      URL.revokeObjectURL(a.href);
      this.showToast(`已导出 ${this.tasks.length} 条任务`);
    },

    confirmClearAll() {
      if (!this.clearArmed) {
        this.clearArmed = true;
        clearTimeout(this._clearTimer);
        this._clearTimer = setTimeout(() => { this.clearArmed = false; }, 3000);
        return;
      }
      clearTimeout(this._clearTimer);
      this.clearArmed = false;
      const all = [...this.activeTasks];
      const now = new Date().toISOString();
      all.forEach(t => { t.deleted_at = now; });
      this.tasks = [];
      this.trashTasks.unshift(...all);
      if (this.isCloud && this.user) all.forEach(t => this.cloudMutate('upsert', t));
      this.showToast('已清空（可在回收站恢复）');
      this.closeProfile();
    },

    /* ---------------- 离线推送（Web Push）---------------- */
    urlBase64ToUint8Array(b64) {
      const padding = '='.repeat((4 - (b64.length % 4)) % 4);
      const base64 = (b64 + padding).replace(/-/g, '+').replace(/_/g, '/');
      const raw = atob(base64);
      return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
    },

    async enablePush() {
      if (!this.isCloud || !this.user) { this.showToast('离线推送需要登录账号（云同步模式）'); return; }
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        this.showToast('当前浏览器不支持离线推送'); return;
      }
      this.pushBusy = true;
      try {
        let perm = Notification.permission;
        if (perm === 'default') perm = await Notification.requestPermission();
        if (perm !== 'granted') { this.notifPerm = perm; this.showToast('通知权限被拒绝，请在浏览器设置中允许后重试'); return; }
        this.notifPerm = perm;
        const reg = await navigator.serviceWorker.ready;
        let sub = await reg.pushManager.getSubscription();
        if (!sub) {
          sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: this.urlBase64ToUint8Array(CONFIG.VAPID_PUBLIC_KEY),
          });
        }
        const { error } = await this.sb.from('push_subscriptions').upsert({
          endpoint: sub.endpoint,
          sub: sub.toJSON(),
          user_id: this.user.id,
        });
        if (error) throw error;
        this.pushOn = true;
        this.showToast('✅ 离线推送已开启：应用关着也能收到提醒');
      } catch (e) {
        this.showToast('开启失败：' + ((e && e.message) || e));
      } finally {
        this.pushBusy = false;
      }
    },

    async savePushplus() {
      const t = (this.pushplusDraft || '').trim();
      if (this.isCloud && this.user) {
        try {
          const { data, error } = await this.sb.auth.updateUser({ data: { pushplus_token: t } });
          if (error) throw error;
          if (data && data.user) this.user = data.user;
        } catch (e) { this.showToast('绑定失败：' + ((e && e.message) || e)); return; }
      }
      this.showToast(t ? '✅ 微信推送已绑定（到期自动推送到微信）' : '已解绑微信推送');
    },

    async checkPushState() {
      if (!this.isCloud || !('serviceWorker' in navigator) || !('PushManager' in window)) return;
      try {
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.getSubscription();
        this.pushOn = !!(sub && Notification.permission === 'granted');
      } catch (e) {}
    },

    async testPush() {
      if (!this.pushOn) { this.showToast('请先开启离线推送'); return; }
      const now = new Date();
      const d = new Date(now.getTime() + 90000); // 1.5 分钟后触发
      const p = n => String(n).padStart(2, '0');
      const local = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
      const task = {
        id: uuid(),
        title: '🔔 离线推送通道测试',
        completed: false,
        priority: 'medium',
        due_date: null,
        remind_at: this.parseLocalDateTime(local),
        repeat: null,
        tags: [],
        subtasks: [],
        image: null,
        list_id: this.currentListId,
        sort_order: Date.now(),
        created_at: now.toISOString(),
        updated_at: now.toISOString(),
        completed_at: null,
        deleted_at: null,
      };
      this.tasks.unshift(task);
      if (this.isCloud && this.user) this.cloudMutate('upsert', task);
      this.showToast('已创建 1.5 分钟后提醒的测试任务，关掉应用等通知 🔔');
    },

    /* ---------------- 到期提醒 ---------------- */
    requestNotif() {
      Notification.requestPermission().then(p => {
        this.notifPerm = p;
        this.showToast(p === 'granted' ? '🔔 提醒已开启' : '未开启提醒（浏览器权限被拒绝）');
      });
    },

    checkReminders() {
      if (this.notifPerm !== 'granted' || !this.tasks.length) return;
      const now = Date.now();
      let store = {};
      try { store = JSON.parse(localStorage.getItem('todo.reminded') || '{}'); } catch (e) {}
      let dirty = false;
      for (const t of this.tasks) {
        if (!t.remind_at || t.completed) continue;
        const ts = new Date(t.remind_at).getTime();
        const key = t.id + '|' + t.remind_at;
        if (ts <= now && ts > now - 86400000 && !store[key]) {
          try { new Notification('⏰ 待办提醒', { body: t.title, tag: key }); } catch (e) {}
          store[key] = 1;
          dirty = true;
        }
      }
      if (dirty) {
        try { localStorage.setItem('todo.reminded', JSON.stringify(store)); } catch (e) {}
      }
    },

    /* ---------------- 编辑 ---------------- */
    startEdit(task) {
      this.editingId = task.id;
      this.editTask = {
        id: task.id,
        title: task.title,
        priority: task.priority || 'medium',
        due_date: task.due_date || null,
        remind_at: this.toLocalInputValue(task.remind_at) || null,
        tagsText: (task.tags || []).join(', '),
        repeat: task.repeat || '',
      };
      this.$nextTick(() => {
        const el = document.querySelector('.task-edit input');
        if (el) { el.focus(); el.select(); }
      });
    },

    saveEdit() {
      if (!this.editTask.title) return;
      const t = this.tasks.find(x => x.id === this.editingId);
      if (t) {
        t.title = this.editTask.title;
        t.priority = this.editTask.priority;
        t.due_date = this.editTask.due_date || null;
        t.remind_at = this.parseLocalDateTime(this.editTask.remind_at);
        t.repeat = this.editTask.repeat || null;
        t.tags = this.parseTags(this.editTask.tagsText);
        t.updated_at = new Date().toISOString();
        if (this.isCloud && this.user) this.cloudMutate('upsert', t);
      }
      this.editingId = null;
    },

    cancelEdit() { this.editingId = null; },

    /* ---------------- 账号 ---------------- */
    toggleAuthMode() {
      this.authMode = this.authMode === 'login' ? 'register' : 'login';
      this.authError = '';
      this.authNotice = '';
    },

    async submitAuth() {
      this.authError = '';
      this.authNotice = '';
      if (this.authForm.password.length < 6) {
        this.authError = '密码至少需要 6 位';
        return;
      }
      this.authBusy = true;
      try {
        if (this.authMode === 'login') {
          const { data, error } = await this.sb.auth.signInWithPassword({
            email: this.authForm.email, password: this.authForm.password,
          });
          if (error) throw error;
          await this.onSignedIn(data.user);
        } else {
          const { data, error } = await this.sb.auth.signUp({
            email: this.authForm.email, password: this.authForm.password,
          });
          if (error) throw error;
          if (data.session) {
            await this.onSignedIn(data.user);
          } else {
            this.authNotice = '注册成功！请到邮箱点击确认链接后再登录。';
            this.authMode = 'login';
          }
        }
      } catch (e) {
        this.authError = this.friendlyAuthError(e);
      } finally {
        this.authBusy = false;
      }
    },

    friendlyAuthError(e) {
      const msg = (e && (e.message || e.msg)) || String(e || '');
      if (/Invalid login credentials/i.test(msg)) return '邮箱或密码错误';
      if (/User already registered/i.test(msg)) return '该邮箱已注册，请直接登录';
      if (/Email not confirmed/i.test(msg)) return '邮箱尚未确认，请先到邮箱点击确认链接';
      if (/Password should be at least/i.test(msg)) return '密码至少需要 6 位';
      if (/Failed to fetch|NetworkError|fetch failed|load failed/i.test(msg)) return '网络连接失败，请检查网络后重试';
      return '操作失败：' + msg;
    },

    async onSignedIn(user) {
      this.user = user;
      this.pendingCount = this.readQueue().length;
      const meta = (user && user.user_metadata) || {};
      this.nickname = meta.nickname || '';
      this.avatarUrl = meta.avatar_url || '';
      this.nicknameDraft = this.nickname;
      this.pushplusDraft = meta.pushplus_token || '';
      await this.loadLists();
      await this.loadTasks();
      this.subscribeRealtime();
      this.checkPushState();
    },

    async logout() {
      this.closeProfile();
      try {
        if (this.channel) { await this.sb.removeChannel(this.channel); this.channel = null; }
        await this.sb.auth.signOut();
      } catch (e) { /* 忽略退出时的网络错误 */ }
      this.onSignedOut();
    },

    onSignedOut() {
      this.user = null;
      this.tasks = [];
      this.trashTasks = [];
      this.editingId = null;
      this.view = 'today';
      this.pendingCount = 0;
      this.authForm.password = '';
      this.authMode = 'login';
      try {
        this.nickname = localStorage.getItem('todo.nickname') || '';
        this.avatarUrl = localStorage.getItem('todo.avatar') || '';
        this.nicknameDraft = this.nickname;
      } catch (e) {}
      this.loadLocalAll();
    },

    /* ---------------- 云端数据加载 / 实时同步 ---------------- */
    async loadTasks() {
      this.loading = true;
      try {
        const { data, error } = await this.sb.from('tasks')
          .select('*').is('deleted_at', 'null').order('created_at', { ascending: false });
        if (error) throw error;
        let list = (data || []).map(t => this.normalizeTask(t));
        const queue = this.readQueue();
        if (queue.length) {
          const map = new Map(list.map(t => [t.id, t]));
          for (const op of queue) {
            if (op.type === 'delete') map.delete(op.data.id);
            else map.set(op.data.id, { ...(map.get(op.data.id) || {}), ...this.normalizeTask(op.data) });
          }
          list = [...map.values()];
        }
        this.tasks = list;
        this.writeCache();
      } catch (e) {
        this.tasks = this.readCache().map(t => this.normalizeTask(t));
        if (!this.tasks.length) this.showToast('云端加载失败，正在显示本地缓存');
      } finally {
        this.loading = false;
      }
    },

    async loadTrash() {
      if (!this.isCloud || !this.user) return;
      const { data } = await this.sb.from('tasks').select('*').not('deleted_at', 'is', null)
        .order('deleted_at', { ascending: false });
      this.trashTasks = (data || []).map(t => this.normalizeTask(t));
      this.purgeOldTrash();
    },

    normalizeTask(t) {
      return { ...t, subtasks: t.subtasks || [], tags: t.tags || [] };
    },

    subscribeRealtime() {
      if (this.channel) { this.sb.removeChannel(this.channel); this.channel = null; }
      this.channel = this.sb.channel('tasks-realtime')
        .on('postgres_changes',
          { event: '*', schema: 'public', table: 'tasks', filter: 'user_id=eq.' + this.user.id },
          payload => this.onRealtimeChange(payload))
        .subscribe();
    },

    onRealtimeChange(payload) {
      const { eventType, new: newRow, old: oldRow } = payload;
      const queue = this.readQueue();
      if (eventType === 'INSERT' || eventType === 'UPDATE') {
        if (!newRow || !newRow.id) return;
        if (queue.some(op => op.data.id === newRow.id && op.type !== 'delete')) return;
        const row = this.normalizeTask(newRow);
        if (row.deleted_at) {
          // 已删除：从主列表移除，进回收站
          this.tasks = this.tasks.filter(t => t.id !== row.id);
          if (!this.trashTasks.some(t => t.id === row.id)) this.trashTasks.unshift(row);
          return;
        }
        this.trashTasks = this.trashTasks.filter(t => t.id !== row.id);
        const i = this.tasks.findIndex(t => t.id === row.id);
        if (i >= 0) this.tasks.splice(i, 1, { ...this.tasks[i], ...row });
        else this.tasks.unshift(row);
      } else if (eventType === 'DELETE') {
        if (!oldRow || !oldRow.id) return;
        this.tasks = this.tasks.filter(t => t.id !== oldRow.id);
        this.trashTasks = this.trashTasks.filter(t => t.id !== oldRow.id);
      }
    },

    /* ---------------- 云端写入 + 离线队列 ---------------- */
    toRow(task) {
      return {
        id: task.id,
        user_id: this.user.id,
        title: task.title,
        completed: !!task.completed,
        priority: task.priority || 'medium',
        due_date: task.due_date || null,
        remind_at: task.remind_at || null,
        repeat: task.repeat || null,
        tags: task.tags || [],
        subtasks: task.subtasks || [],
        image: task.image || null,
        list_id: task.list_id || null,
        sort_order: task.sort_order != null ? task.sort_order : Date.now(),
        created_at: task.created_at,
        updated_at: task.updated_at,
        completed_at: task.completed_at || null,
        deleted_at: task.deleted_at || null,
      };
    },

    isNetworkError(e) {
      const msg = (e && e.message) || String(e || '');
      return /Failed to fetch|NetworkError|fetch failed|load failed|network/i.test(msg);
    },

    isSchemaError(e) {
      const msg = (e && (e.message || e.code)) || '';
      return /PGRST204|schema cache|Could not find the .* column/i.test(String(msg));
    },

    async cloudMutate(type, task) {
      const queue = this.readQueue();
      if (queue.length) {
        queue.push({ type, data: task });
        this.writeQueue(queue);
        return;
      }
      this.syncing = true;
      try {
        const { error } = type === 'delete'
          ? await this.sb.from('tasks').delete().eq('id', task.id)
          : await this.sb.from('tasks').upsert(this.toRow(task));
        if (error) throw error;
      } catch (e) {
        if (!navigator.onLine || this.isNetworkError(e)) {
          queue.push({ type, data: task });
          this.writeQueue(queue);
        } else if (this.isSchemaError(e)) {
          this.showToast('云端数据库需要升级：请按 SETUP.md 运行「v6 升级 SQL」');
        } else {
          this.showToast('同步失败：' + ((e && e.message) || e));
        }
      } finally {
        this.syncing = false;
      }
    },

    async flushQueue() {
      if (!this.isCloud || !this.user || this.syncing) return;
      const queue = this.readQueue();
      if (!queue.length) return;
      this.syncing = true;
      const remain = [];
      let offlineHit = false;
      for (let i = 0; i < queue.length; i++) {
        const op = queue[i];
        try {
          if (op.type === 'delete') {
            const { error } = await this.sb.from('tasks').delete().eq('id', op.data.id);
            if (error) throw error;
          } else {
            const { error } = await this.sb.from('tasks').upsert(this.toRow(op.data));
            if (error) throw error;
          }
        } catch (e) {
          if (!navigator.onLine || this.isNetworkError(e)) {
            remain.push(...queue.slice(i));
            offlineHit = true;
            break;
          }
          this.showToast('一条更改同步失败已跳过：' + ((e && e.message) || e));
        }
      }
      this.writeQueue(remain);
      this.syncing = false;
      if (!remain.length && !offlineHit) this.showToast('✅ 所有更改已同步');
    },

    /* ---------------- localStorage 读写 ---------------- */
    storageKey(name) {
      return `todo.${this.isCloud && this.user ? this.user.id : 'local'}.${name}`;
    },
    loadLocalAll() {
      try {
        const all = JSON.parse(localStorage.getItem('todo.tasks.v1') || '[]')
          .filter(t => t && t.id && t.title);
        this.tasks = all.filter(t => !t.deleted_at).map(t => this.normalizeTask(t));
        this.trashTasks = all.filter(t => t.deleted_at);
        try {
          this.lists = JSON.parse(localStorage.getItem('todo.lists') || '[]');
        } catch (e) {}
        this.currentListId = localStorage.getItem(this.storageKey('currentList')) || null;
      } catch (e) {}
    },
    saveLocal() {
      try {
        localStorage.setItem('todo.tasks.v1', JSON.stringify([...this.tasks, ...this.trashTasks]));
      } catch (e) {}
    },
    cacheKey() { return 'todo.cloud.' + (this.user ? this.user.id : 'anon'); },
    writeCache() {
      try { localStorage.setItem(this.cacheKey() + '.cache', JSON.stringify(this.tasks)); } catch (e) {}
    },
    readCache() {
      try {
        const list = JSON.parse(localStorage.getItem(this.cacheKey() + '.cache') || '[]');
        return Array.isArray(list) ? list : [];
      } catch (e) { return []; }
    },
    readQueue() {
      try {
        const q = JSON.parse(localStorage.getItem(this.cacheKey() + '.queue') || '[]');
        return Array.isArray(q) ? q : [];
      } catch (e) { return []; }
    },
    writeQueue(q) {
      this.pendingCount = q.length;
      try {
        if (q.length) localStorage.setItem(this.cacheKey() + '.queue', JSON.stringify(q));
        else localStorage.removeItem(this.cacheKey() + '.queue');
      } catch (e) {}
    },
  },
});

/* Naive UI 组件注册（全局构建，详见 vendor/naive-ui.min.js） */
if (window.naive) {
  app.use(window.naive.default || window.naive);
}
app.mount('#app');

/* ---------------- PWA：注册 Service Worker（离线缓存）----------------
 * 仅在线上（https）或本地开发服务器（localhost）注册；
 * 双击 file:// 打开时自动跳过，不影响使用。 */
if ('serviceWorker' in navigator &&
    (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
